# =============================================================================
# no_obstacle.yaml
# -----------------------------------------------------------------------------
# World 1 of the user-study world set: free-space table + red/blue graspable
# cylinders, NO extra obstacles. This is the baseline/easiest scenario -- the
# user's raw teleoperation capability under each feedback condition, with
# nothing forcing a particular grasp approach or path.
#
# RENAMED 2026-07-04 (was bimanual_default.yaml / world_name "bimanual_default").
# Values are otherwise UNCHANGED -- this is a pure rename, not a new scenario;
# still reproduces exactly what used to be hard-coded in qp_controller/
# config.py (TABLE_POS/TABLE_SIZE/RED_CYLINDER_POS/BLUE_CYLINDER_POS/
# CYLINDER_SIZE).
#
# NAMING CONVENTION (established with this rename, follow it for every future
# world in the study set): the YAML filename ALWAYS matches the Gazebo
# .world filename (minus extension). This file <-> no_obstacle.world.
# world_name: below matches both.
#
# Matches the Gazebo world launched today via:
#   ros2 launch triago_gazebo triago_gazebo.launch.py ... world_name:=no_obstacle
#
# See triago_control/qp_controller/world_loader.py for the full schema
# documentation and how each field is consumed.
#
# HOW TO MAKE A NEW WORLD
#   1. Copy this file to config/worlds/<your_world_name>.yaml, where
#      <your_world_name> MATCHES your new <your_world_name>.world file
#      (see naming convention above).
#   2. Edit `static_obstacles` poses/sizes/colors to match your new Gazebo
#      world's SDF <model><pose>/<geometry> blocks (keep the two in sync by
#      hand -- this YAML does not read the .world file, it must mirror it).
#   3. Keep `grasp_roles` pointing at whichever obstacle names are the
#      graspable red/blue cylinders in the new layout (rename `name:` fields
#      freely, just update grasp_roles to match).
#   4. Run with:
#        ros2 run triago_control main_qp_controller.py --ros-args \
#             -p world_name:=<your_world_name>
#        ros2 run triago_control main_shared_autonomy.py --ros-args \
#             -p world_name:=<your_world_name>
#      (the Gazebo launch command itself is unchanged in STRUCTURE -- only
#       point its world_name:= arg at the matching .world file yourself.)
# =============================================================================

world_name: "no_obstacle"
gazebo_world_file: "no_obstacle.world"   # bookkeeping pointer only; not read by this loader

static_obstacles:
  - name: "work_table"
    role: "table"
    shape: "box"
    pose: [1.0, 0.0, 0.35, 0.0, 0.0, 0.0]
    size: [0.6, 0.5, 0.7]
    color: [0.6, 0.4, 0.2, 0.8]
    collision: true

  - name: "red_cylinder"
    role: "graspable"
    shape: "cylinder"
    pose: [0.800, -0.20, 0.775, 0.0, 0.0, 0.0]
    size: [0.02, 0.15]          # [radius, length]
    color: [1.0, 0.0, 0.0, 1.0]
    collision: true

  - name: "blue_cylinder"
    role: "graspable"
    shape: "cylinder"
    pose: [0.800, 0.20, 0.775, 0.0, 0.0, 0.0]
    size: [0.02, 0.15]
    color: [0.0, 0.0, 1.0, 1.0]
    collision: true

  # Virtual wall: OFF by default (mirrors the old WALL_COLLIDER=False flag).
  # Flip collision: true to enable it -- geometry/pose match the old
  # WALL_POS/WALL_SIZE constants exactly.
  - name: "virtual_wall"
    role: "wall"
    shape: "box"
    pose: [0.5, 0.0, 0.5, 0.0, 0.0, 0.0]
    size: [1.0, 0.02, 1.0]
    color: [1.0, 0.5, 0.0, 0.5]
    collision: false

grasp_roles:
  red: "red_cylinder"
  blue: "blue_cylinder"

# The yellow placement disk (Gazebo model "placement_area") the grasped
# cylinders must be set down on. NOT an obstacle -- no collision, never
# added to the CBF's collision model. Purely the reference pose for the
# shared-autonomy Platform_Place goal; the operator sees the disk itself
# directly in Gazebo/RViz (rendered by the .world file), so nothing on the
# QP/RViz-marker side needs to draw it separately.
platform:
  pose: [1.000, 0.0, 0.701]
  radius: 0.15
  thickness: 0.002
  place_margin: 0.03
