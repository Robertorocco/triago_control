# =============================================================================
# handover_world.yaml
# -----------------------------------------------------------------------------
# BIMANUAL HANDOVER scenario. Same main table + red/blue cylinders as
# no_obstacle, PLUS:
#   * a vertical DIVIDER that cuts the main table in half along y=0, separating
#     the LEFT half (y>0, blue cylinder) from the RIGHT half (y<0, red cylinder);
#   * a smaller SIDE TABLE further to the right (y<0) carrying the FINAL platform.
#
# INTENDED TASK: the LEFT hand picks the blue cylinder, lifts it over the divider
# and sets it on the HANDOVER platform on the right half of the main table; the
# RIGHT hand then picks it up and places it on the FINAL platform on the side
# table. The divider forces the handover: neither hand can reach across it.
#
# TWO functional platforms (multi-platform support): both the HANDOVER and the
# FINAL disk are real Platform_* goals, available to BOTH arms in the belief /
# guidance stack (see world_loader `platforms:` + goal_set.py platform_keys).
#   * When an arm holds a cylinder, BOTH platform goals become demandable for it;
#     the belief picks whichever the operator steers toward.
#   * Goal keys: 'Platform_Handover' and 'Platform_Final'.
# NOTE: single-platform worlds (no_obstacle/shield/rack, which use the old
# `platform:` mapping) are UNCHANGED -- they still produce exactly one
# 'Platform_Place' goal with identical behaviour.
#
# GEOMETRY (axis-aligned boxes / disks):
#   main table:  center [1.0, 0.0, 0.35], size [0.6,0.5,0.7]  (top z=0.70)
#   divider:     center [1.0, 0.0, 0.80], size [0.6,0.03,0.20] (on table, top z=0.90)
#   side table:  center [0.9,-0.85,0.35], size [0.3,0.3,0.7]  (top z=0.70)
#   cylinders:   blue (LEFT)  [0.80,+0.20,0.775]; red (RIGHT) [0.80,-0.20,0.775]
#   HANDOVER platform: center [1.0,-0.12,0.701], r=0.09 (right half of main table)
#   FINAL platform:    center [0.9,-0.85,0.701], r=0.10 (on the side table)
#
# Matches config/worlds/handover_world.world. Run with world_name:=handover_world.
# See triago_control/qp_controller/world_loader.py for the full schema.
# =============================================================================

world_name: "handover_world"
gazebo_world_file: "handover_world.world"

static_obstacles:
  - name: "work_table"
    role: "table"
    shape: "box"
    pose: [1.0, 0.0, 0.35, 0.0, 0.0, 0.0]
    size: [0.6, 0.5, 0.7]
    color: [0.6, 0.4, 0.2, 0.8]
    collision: true

  - name: "red_cylinder"
    role: "graspable"
    shape: "cylinder"
    pose: [0.800, -0.20, 0.775, 0.0, 0.0, 0.0]
    size: [0.02, 0.15]          # [radius, length]
    color: [1.0, 0.0, 0.0, 1.0]
    collision: true

  - name: "blue_cylinder"
    role: "graspable"
    shape: "cylinder"
    pose: [0.800, 0.20, 0.775, 0.0, 0.0, 0.0]
    size: [0.02, 0.15]
    color: [0.0, 0.0, 1.0, 1.0]
    collision: true

  # --- Table divider: vertical wall on the main table at y=0 ---------------- #
  # Splits LEFT (y>0, blue) from RIGHT (y<0, red). Forces the handover.
  - name: "table_divider"
    role: "obstacle"
    shape: "box"
    pose: [1.0, 0.0, 0.80, 0.0, 0.0, 0.0]
    size: [0.6, 0.03, 0.20]
    color: [0.5, 0.5, 0.55, 1.0]
    collision: true

  # --- Side table (smaller, further right): carries the FINAL platform ------ #
  # Moved 20 cm further right (y -0.45 -> -0.65) and shrunk (0.4x0.4 -> 0.3x0.3).
  - name: "side_table"
    role: "obstacle"
    shape: "box"
    pose: [0.9, -0.85, 0.35, 0.0, 0.0, 0.0]
    size: [0.3, 0.3, 0.7]
    color: [0.6, 0.4, 0.2, 0.8]
    collision: true

grasp_roles:
  red: "red_cylinder"
  blue: "blue_cylinder"

# TWO functional placement goals (multi-platform). Both are demandable by either
# arm whenever it holds a cylinder; the belief/guidance picks the one the operator
# steers toward.
#   - Handover: right half of the main table, just right of the divider (r=0.09).
#               The LEFT hand sets the blue cylinder here for the RIGHT hand.
#   - Final:    on the side table, further right (r=0.10). The RIGHT hand's final
#               placement.
platforms:
  - name: "Handover"
    pose: [1.000, -0.12, 0.701]
    radius: 0.09
    thickness: 0.002
    place_margin: 0.03
  - name: "Final"
    pose: [0.900, -0.85, 0.701]
    radius: 0.10
    thickness: 0.002
    place_margin: 0.03
