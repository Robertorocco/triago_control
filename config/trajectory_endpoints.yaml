# =============================================================================
# trajectory_endpoints.yaml
# -----------------------------------------------------------------------------
# Endpoint library + behaviour flags for `trajectory_generator.py`.
#
# This file is the SINGLE source of truth for the open-loop robustness tests
# fed into `main_qp_controller.py`. The generator only ever publishes on the
# standard cartesian-reference contract, so the QP controller stays untouched.
#
# Reference contract consumed by main_qp_controller (`ref_cb_right/left`):
#     [x, y, z, roll, pitch, yaw, xdot, ydot, zdot, wx, wy, wz, (task_dim)]
#   - 12 floats  -> full 6-DOF reference (position + orientation)
#   - 13th float -> optional task dimension (6.0 = full 6D, 5.0 = align X only)
#   - 6  floats  -> position-only fallback (used when control_orientation: false)
#
# Frame conventions (base_footprint):
#     X = forward (in front of TIAGo)
#     Y = left
#     Z = up
#     Origin: center of TIAGo torso
#
# Gripper frame (gripper_{right,left}_grasping_link):
#     X = approach axis (points outward from gripper)
#     Z = down (palm bottom direction)
#     Y = right (finger-spread direction)
#
# Orientation is specified as RPY [roll, pitch, yaw] in radians expressing
# the desired gripper frame orientation in base_footprint. Common values:
#     forward-down   : [3.1416, 0, 0]       gripper forward, palm down
#     top-grasp      : [0, 1.5708, 0]       gripper pointing down, palm forward
#     approach-left  : [3.1416, 0, 1.5708]  gripper pointing left, palm down
#     approach-right : [3.1416, 0, -1.5708] gripper pointing right, palm down
#
# How to run a test:
#   1. edit `active_preset` below to point at one of the entries under `presets`
#   2. (optional) flip `dynamic_trajectory` / tune `duration`
#   3. colcon build --packages-select triago_control && source install/setup.bash
#   4. ros2 run triago_control trajectory_generator.py
#      (override this file at runtime with:
#         ros2 run triago_control trajectory_generator.py --ros-args \
#              -p config_file:=/absolute/path/to/trajectory_endpoints.yaml)
# =============================================================================

# --- WHICH TEST TO RUN -------------------------------------------------------
active_preset: "s_curve_right"
#crossing_swap
# --- GLOBAL BEHAVIOUR FLAGS --------------------------------------------------
# Lambda-driven time scaling (dynamic_trajectory / DYNAMIC_TRAJECTORY flag).
# When true: the trajectory virtual clock slows as the CBF shadow price grows.
# When false: the clock is rigid (constant speed).
dynamic_trajectory: false

# Publish 6-DOF references (position + orientation).
#   true  -> 12/13-float msgs; orientation is interpolated from start to target.
#   false -> 6-float position-only msgs (orientation left free to the QP).
control_orientation: true

# Task dimension appended as the 13th float when control_orientation is true:
#   6.0 -> full position + orientation tracking (SO(3) log error)
#   5.0 -> position + X-axis alignment only (yaw about the tool axis is free)
task_dimension: 6.0

# Frame the targets and the RViz phase marker are expressed in.
# Origin is at the center of TIAGo's mobile base (ground plane).
# Axes: X=forward, Y=left, Z=up. Positive Y = left robot side.
ref_frame: "base_footprint"

# --- TRAJECTORY SHAPE / TIMING ----------------------------------------------
duration: 20.0        # [s] virtual time to complete the quintic motion (fast → instantaneous feel)
delay_start: 1.0     # [s] settle window used to sample the real start pose
cube_size: 0.1       # [m] edge of the random perturbation cube (swap_perturbed)

# =============================================================================
# ENDPOINT PRESETS
# -----------------------------------------------------------------------------
# Each preset defines, per hand, the cartesian target (position + orientation).
#
# Fields:
#   category    : free_space | collision_risk | out_of_workspace  (label only)
#   description : human-readable note
#   arms        : right | left | both  (inactive arm holds its sampled start)
#   mode        : absolute        -> use explicit right/left xyz + rpy
#                 swap            -> right -> left start, left -> right start
#                 swap_perturbed  -> swap + uniform noise within +/- cube_size/2
#                 path            -> smooth multi-waypoint spline, see below
#   right/left  : [x, y, z] absolute target position in base_footprint
#   rpy_right/rpy_left : [roll, pitch, yaw] target orientation in base_footprint
#                        If omitted, the sampled start orientation is held.
#
# For swap/swap_perturbed modes:
#   rpy_right/rpy_left define the target orientation at the swapped position.
#   Omitting them holds the start orientation (each arm keeps its own).
#
# For mode: path:
#   waypoints_right/waypoints_left : list of [x, y, z] points (base_footprint)
#     visited IN ORDER after the sampled start; the LAST point is the final
#     target (used the same way `right`/`left` are in absolute mode -- also
#     drives rpy_right/rpy_left / the inactive-arm hold). trajectory_generator
#     threads a cubic spline through [sampled_start] + this list, arc-length
#     parametrized so it still rides the same quintic timing profile as every
#     other preset -- this is a shape change only, not a timing change. Only
#     set the waypoint list for the ACTIVE arm(s); the field can simply be
#     omitted for an inactive one (it holds its sampled start as usual).
# =============================================================================
presets:

  # --- 1. FREE SPACE -- single arm (right only, gentlest test) ---------------
  right_reach:
    category: free_space
    description: "Right hand forward reach. Left holds position.
                  Gripper points forward with palm down (comfortable reach)."
    arms: right
    mode: absolute
    right: [0.8, -0.5, 0.8]
    left:  [0.5,  0.5, 0.8]
    rpy_right: [3.1416, 0.0, 0.0]       # forward-down
    rpy_left:  [3.1416, 0.0, 0.0]       # forward-down (held, arm inactive)

  # --- 2. FREE SPACE -- both arms, symmetric "home" pose ---------------------
  home:
    category: free_space
    description: "Both hands to symmetric home pose. Grippers forward, palms down."
    arms: both
    mode: absolute
    right: [0.6, -0.5, 0.8]
    left:  [0.6,  0.5, 0.8]
    rpy_right: [3.1416, 0.0, 0.0]       # forward-down
    rpy_left:  [3.1416, 0.0, 0.0]       # forward-down

  # --- 3. FREE SPACE -- both arms lowered (top-grasp orientation) ------------
  lowered:
    category: free_space
    description: "Both hands lowered (descend in Z). Grippers reorient to
                  top-grasp pose (approach axis pointing down, palm forward)."
    arms: both
    mode: absolute
    right: [0.5, -0.5, 0.3]
    left:  [0.5,  0.5, 0.3]
    rpy_right: [0.0, 1.5708, 0.0]       # top-grasp
    rpy_left:  [0.0, 1.5708, 0.0]       # top-grasp

  # --- 4. FREE SPACE -- both arms slid forward (keep forward-down) -----------
  sliding:
    category: free_space
    description: "Both hands pushed forward in X. Grippers stay forward, palms down."
    arms: both
    mode: absolute
    right: [0.8, -0.5, 0.8]
    left:  [0.8,  0.5, 0.8]
    rpy_right: [3.1416, 0.0, 0.0]       # forward-down
    rpy_left:  [3.1416, 0.0, 0.0]       # forward-down

  # --- 5. COLLISION RISK -- perfect arm swap with orientation ----------------
  crossing_swap:
    category: collision_risk
    description: "Perfect swap: each hand drives to the other's start position.
                  Right gripper orients to approach-left (pointing toward left
                  workspace), left gripper orients to approach-right. This is the
                  natural wrist orientation when crossing arms."
    arms: both
    mode: swap
    rpy_right: [3.1416, 0.0, 1.5708]    # approach-left (right hand ends on left side)
    rpy_left:  [3.1416, 0.0, -1.5708]   # approach-right (left hand ends on right side)

  # --- 6. COLLISION RISK -- swap with random perturbation --------------------
  crossing_perturbed:
    category: collision_risk
    description: "Swap targets with uniform random perturbation inside a cube.
                  Orientation same as crossing_swap (approach toward opposite side)."
    arms: both
    mode: swap_perturbed
    rpy_right: [3.1416, 0.0, 1.5708]    # approach-left
    rpy_left:  [3.1416, 0.0, -1.5708]   # approach-right

  # --- 7. OUT OF WORKSPACE -- cross-body target ------------------------------
  out_of_ws:
    category: out_of_workspace
    description: "Right hand commanded across the body to the left workspace
                  (0.7, 0.5, 0.3). Gripper points left (approach-left) since
                  it is reaching into the left side. Probes CBF saturation."
    arms: both
    mode: absolute
    right: [0.7, 0.5, 0.3]
    left:  [0.5, 0.5, 0.3]
    rpy_right: [3.1416, 0.0, 1.5708]    # approach-left (crossing to left side)
    rpy_left:  [0.0, 1.5708, 0.0]       # top-grasp (lowered position)


  # ==========================================================================
  # LOCAL MINIMA TESTS (2026-07-01)
  # ==========================================================================
  # These presets are designed to trigger QP-CLF-CBF local minima — situations
  # where the QP cannot make progress toward the target because the CLF's
  # gradient direction is blocked by a hard constraint (joint limit and/or CBF
  # obstacle) and no feasible joint velocity can simultaneously decrease V(e)
  # AND satisfy all barrier constraints. The robot "parks" with a nonzero
  # tracking error it cannot reduce — a local minimum in the CLF's landscape
  # restricted to the CBF-safe set.
  #
  # Use with:
  #   - ENABLE_REFERENCE_GOVERNOR = False (so the raw, far-away reference hits
  #     the CLF directly with a huge error, maximizing the chance of conflict)
  #   - duration: 1.0 s (reference slides fast → error appears instantly)
  #   - Start from 'home' pose first, then switch active_preset here and re-run.
  #
  # (2026-07-04: "local_minima_behind" -- Case 1, BEHIND THE ROBOT -- was
  # removed per instruction. Case 2, THROUGH THE TABLE, remains below.)
  #
  # Case 2: THROUGH THE TABLE (obstacle conflict, no joint-limit issue)
  #   The right hand is commanded to a position INSIDE the table's volume
  #   (X=1.0, which is the table centre, at Z=0.75 which is just above the
  #   table surface) with the gripper pointing DOWN (top-grasp). The arm can
  #   reach X=1.0 kinematically (it's in the forward workspace) BUT:
  #     - The table CBF blocks penetration into the table volume
  #     - The cylinder CBF blocks lateral paths that would go around the table
  #       (cylinders sit at X=0.8, Y=±0.2)
  #   The CLF wants to push the EE forward+down into the table — the CBF
  #   pushes it back — equilibrium = local minimum with a large position error.
  # --------------------------------------------------------------------------
  local_minima_table:
    category: out_of_workspace
    description: "LOCAL MINIMA TEST 2: right hand commanded INSIDE the table
                  volume (X=1.0, Z=0.75) with gripper pointing down. The CLF
                  wants forward+down, the table CBF pushes back → stuck.
                  Expected: robot parks near the table surface with error."
    arms: right
    mode: absolute
    right: [1.0, -0.2, 0.75]
    left:  [0.6,  0.5, 0.8]
    rpy_right: [0.0, 1.5708, 0.0]       # top-grasp (approach axis pointing DOWN)
    rpy_left:  [3.1416, 0.0, 0.0]       # left holds forward-down (inactive)

  # ==========================================================================
  # SINGLE-ARM 'S' PATH -- encircles both graspable cylinders (mode: path)
  # ==========================================================================
  # world: no_obstacle. Cylinders at [0.80, -/+0.20, 0.775], r=0.02, top z=0.85;
  # table top z=0.70. Waypoints: 9 samples of x = 0.8 + 0.18*sin(2*pi*u),
  # y = -0.38 + 0.76*u, z = 0.93, u = 0..1 (right hand; left is the Y-mirror).
  #
  # CLEARANCE RULE: the CBF enforces h = distance - CAPSULE_RADIUS(0.06)
  # - D_SAFE_BASE(0.015), NOT distance-to-obstacle-surface. Budget any hand-
  # authored path against h (this shape: min h ~ +0.077 at the cylinders,
  # +0.154 at the table). The first cut (z=0.775, +/-0.08m bulge) ignored
  # that, was infeasible the whole sweep (h ~ -0.03), and caused heavy CBF
  # saturation + qdot oscillation -- it is preserved below as
  # s_curve_right_infeasible_regression. Full story: .kiro/context.md §2.
  #
  # HOW TO RUN: active_preset "home" first (samples a clean start), then one
  # of these; bump the top-level `duration:` to ~10-15s (the path is long).
  # --------------------------------------------------------------------------
  s_curve_right:
    category: collision_risk
    description: "Right hand only. Starts right of the red cylinder (0.08m
                  above cylinder-top height), arcs smoothly around it, crosses
                  the gap at the midline, arcs around the blue cylinder the
                  opposite way, ends left of it. Left hand holds its sampled
                  start (inactive). Gripper reorients to top-grasp (pointing
                  down) over the course of the sweep."
    arms: right
    mode: path
    waypoints_right:
      - [0.800, -0.380, 0.930]   # right of red (entry)
      - [0.927, -0.285, 0.930]
      - [0.980, -0.190, 0.930]   # around red (bulge away from robot)
      - [0.927, -0.095, 0.930]
      - [0.800,  0.000, 0.930]   # middle (gap between the two cylinders)
      - [0.673,  0.095, 0.930]
      - [0.620,  0.190, 0.930]   # around blue (bulge toward robot)
      - [0.673,  0.285, 0.930]
      - [0.800,  0.380, 0.930]   # left of blue (exit)
    rpy_right: [0.0, 1.5708, 0.0]       # top-grasp, held for the whole sweep
    rpy_left:  [3.1416, 0.0, 0.0]       # left holds forward-down (inactive)

  s_curve_left:
    category: collision_risk
    description: "Left hand only -- the mirror image of s_curve_right (Y
                  negated, same x/z). Starts left of the blue cylinder, arcs
                  around it, crosses the gap at the midline, arcs around the
                  red cylinder the opposite way, ends right of it. Right hand
                  holds its sampled start (inactive)."
    arms: left
    mode: path
    waypoints_left:
      - [0.800,  0.380, 0.930]   # left of blue (entry)
      - [0.927,  0.285, 0.930]
      - [0.980,  0.190, 0.930]   # around blue (bulge away from robot)
      - [0.927,  0.095, 0.930]
      - [0.800,  0.000, 0.930]   # middle (gap between the two cylinders)
      - [0.673, -0.095, 0.930]
      - [0.620, -0.190, 0.930]   # around red (bulge toward robot)
      - [0.673, -0.285, 0.930]
      - [0.800, -0.380, 0.930]   # right of red (exit)
    rpy_left:  [0.0, 1.5708, 0.0]       # top-grasp, held for the whole sweep
    rpy_right: [3.1416, 0.0, 0.0]       # right holds forward-down (inactive)

  # ==========================================================================
  # REGRESSION STRESS TEST -- DO NOT "FIX" THESE NUMBERS.
  # ==========================================================================
  # Deliberately the first-cut infeasible s_curve_right waypoints (see the
  # CLEARANCE RULE above): h ~ -0.03 at the cylinders, ~0 over the table --
  # a reference the CBF must permanently refuse. Acceptance test for any
  # controller-side smoothness/robustness change: run it and compare
  # summary_metrics.json -- the controller must degrade gracefully (no
  # oscillation) even against a reference that is infeasible by design.
  # --------------------------------------------------------------------------
  s_curve_right_infeasible_regression:
    category: collision_risk
    description: "REGRESSION TEST -- intentionally the pre-fix, geometrically
                  infeasible s_curve_right waypoints (cylinder mid-height,
                  +/-0.08m bulge). Verifies the controller degrades gracefully
                  under a bad reference instead of oscillating. Do not adjust
                  the waypoints to make this 'pass' -- that defeats the point."
    arms: right
    mode: path
    waypoints_right:
      - [0.800, -0.300, 0.775]   # right of red (entry, mid-Z)
      - [0.857, -0.225, 0.775]
      - [0.880, -0.150, 0.775]   # around red (bulge away from robot)
      - [0.857, -0.075, 0.775]
      - [0.800,  0.000, 0.775]   # middle (gap between the two cylinders)
      - [0.743,  0.075, 0.775]
      - [0.720,  0.150, 0.775]   # around blue (bulge toward robot)
      - [0.743,  0.225, 0.775]
      - [0.800,  0.300, 0.775]   # left of blue (exit)
    rpy_right: [0.0, 1.5708, 0.0]       # top-grasp, held for the whole sweep
    rpy_left:  [3.1416, 0.0, 0.0]       # left holds forward-down (inactive)
